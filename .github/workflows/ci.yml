name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      # node --test uses Node 24 type stripping and never typechecks, so the
      # build step is the only thing that catches type errors before a user does.
      - run: npm test
      - run: npm run build
